#
# tuya_local device definition for the Finnleo SaunaLogic2 (TyloHelo SL2)
# Copy this file to: /config/custom_components/tuya_local/devices/
#
# See https://github.com/bitswype/finnleo_ha for full documentation.

name: Sauna
products:
  - id: acl5qrawgmjajabn
    manufacturer: TyloHelo
    model: SaunaLogic2
entities:
  - entity: climate
    translation_only_key: heater
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: true
            value: heat
          - dps_val: false
            value: "off"
      - id: 2
        name: temperature
        type: integer
        unit: F
        range:
          min: 25
          max: 194
      - id: 3
        name: current_temperature
        type: integer
  - entity: select
    name: Light
    icon: "mdi:lightbulb"
    dps:
      - id: 101
        name: option
        type: integer
        mapping:
          - dps_val: 0
            value: "Off"
          - dps_val: 1
            value: White
          - dps_val: 2
            value: Red
          - dps_val: 3
            value: Green
          - dps_val: 4
            value: Blue
          - dps_val: 5
            value: Yellow
          - dps_val: 6
            value: Aqua
          - dps_val: 7
            value: Purple
          - dps_val: 8
            value: Rainbow
  - entity: switch
    name: Bluetooth
    icon: "mdi:bluetooth"
    dps:
      - id: 103
        name: switch
        type: boolean
  - entity: sensor
    name: Timer remaining
    class: duration
    dps:
      - id: 10
        name: sensor
        type: integer
        unit: min
  - entity: switch
    name: Sauna Duration
    dps:
      - id: 9
        name: switch
        type: integer
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 1
            value: true
  - entity: select
    name: Delay Time
    dps:
      - id: 105
        name: option
        type: integer
        mapping:
          - dps_val: 0
            value: "Off"
          - dps_val: 1
            value: "1 hour"
          - dps_val: 2
            value: "2 hours"
          - dps_val: 3
            value: "3 hours"
          - dps_val: 4
            value: "4 hours"
          - dps_val: 5
            value: "5 hours"
          - dps_val: 6
            value: "6 hours"
          - dps_val: 7
            value: "7 hours"
          - dps_val: 8
            value: "8 hours"
          - dps_val: 9
            value: "9 hours"
          - dps_val: 10
            value: "10 hours"
          - dps_val: 11
            value: "11 hours"
          - dps_val: 12
            value: "12 hours"
          - dps_val: 13
            value: "13 hours"
          - dps_val: 14
            value: "14 hours"
          - dps_val: 15
            value: "15 hours"
          - dps_val: 16
            value: "16 hours"
          - dps_val: 17
            value: "17 hours"
          - dps_val: 18
            value: "18 hours"
          - dps_val: 19
            value: "19 hours"
          - dps_val: 20
            value: "20 hours"
          - dps_val: 21
            value: "21 hours"
          - dps_val: 22
            value: "22 hours"
          - dps_val: 23
            value: "23 hours"
          - dps_val: 24
            value: "24 hours"
  - entity: sensor
    name: Sauna mode
    category: diagnostic
    dps:
      - id: 4
        name: sensor
        type: string
        optional: true
