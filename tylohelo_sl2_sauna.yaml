#
# tuya_local device definition for the Finnleo SaunaLogic2 (TyloHelo SL2)
# Copy this file to: /config/custom_components/tuya_local/devices/
#
# See https://github.com/bitswype/finnleo_ha for full documentation.
#
# Changelog:
# - DP 4 (Heat Type): changed from read-only sensor to select entity.
#   Confirmed writable. Values: IR, TRAD, NONE. Validated on hardware May 2026.
# - DP 9 (60 Min Timer): changed from diagnostic integer sensor to switch entity.
#   Confirmed bidirectional control. 0 = no timer, 1 = 60 min auto-shutoff.
#   Validated on hardware May 2026.
# - DP 105 (Delay Timer): renamed from 'Sauna state', added unit: h.
#   Delay only takes effect when set after heater is turned on.
#   Countdown display appears in Tuya app but is not exposed as a separate DP.

name: Sauna
products:
  - id: acl5qrawgmjajabn
    manufacturer: TyloHelo
    model: SaunaLogic2
entities:
  - entity: climate
    translation_only_key: heater
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: true
            value: heat
          - dps_val: false
            value: "off"
      - id: 2
        name: temperature
        type: integer
        unit: F
        range:
          min: 25
          max: 194
      - id: 3
        name: current_temperature
        type: integer
  - entity: select
    name: Light
    icon: "mdi:lightbulb"
    dps:
      - id: 101
        name: option
        type: integer
        mapping:
          - dps_val: 0
            value: "Off"
          - dps_val: 1
            value: White
          - dps_val: 2
            value: Red
          - dps_val: 3
            value: Green
          - dps_val: 4
            value: Blue
          - dps_val: 5
            value: Yellow
          - dps_val: 6
            value: Aqua
          - dps_val: 7
            value: Purple
          - dps_val: 8
            value: Rainbow
  - entity: switch
    name: Bluetooth
    icon: "mdi:bluetooth"
    dps:
      - id: 103
        name: switch
        type: boolean
  - entity: sensor
    name: Timer remaining
    class: duration
    dps:
      - id: 10
        name: sensor
        type: integer
        unit: min
  - entity: select
    name: Heat Type
    icon: "mdi:fire"
    dps:
      - id: 4
        name: option
        type: string
        mapping:
          - dps_val: "IR"
            value: Infrared
          - dps_val: "TRAD"
            value: Traditional
          - dps_val: "NONE"
            value: "None"
  - entity: switch
    name: 60 Min Timer
    icon: "mdi:timer"
    dps:
      - id: 9
        name: switch
        type: integer
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 1
            value: true
  - entity: sensor
    name: Delay Timer
    category: diagnostic
    dps:
      - id: 105
        name: sensor
        type: integer
        unit: h
        optional: true
